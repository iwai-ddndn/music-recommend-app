# 日次バッチ: X収集 → Last.fm 人気度 → スコア再計算（仕様書 3章・5章）
name: Daily batch

on:
  schedule:
    - cron: "17 18 * * *" # 毎日 03:17 JST
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    env:
      USE_FIXTURES: "false"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_MONTHLY_BUDGET_USD: ${{ secrets.X_MONTHLY_BUDGET_USD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
      SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run batch:daily
